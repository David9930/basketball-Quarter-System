name: Collector

on:
  schedule:
    # Every six hours while the month's history budget lasts (see "Plan this
    # run" below). Once the backlog is cleared or the budget is spent, only one
    # run a day does any work; the other slots stop within seconds.
    - cron: "17 1,7,13,19 * * *"
    # Backup for each slot, 30 minutes later. GitHub sometimes drops a
    # scheduled start. If the main slot ran, the backup stops within seconds;
    # if it did not, the backup does the work.
    - cron: "47 1,7,13,19 * * *"
  # A commit that changes .github/run-now starts a run (same as "update").
  push:
    branches: [main]
    paths: [".github/run-now"]
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        default: update
        options: [update, discover, harvest, probe]
      max_minutes:
        description: Stop cleanly after this many minutes
        default: "240"

permissions:
  contents: write
  issues: write               # to raise a "Collector stopped" issue when a run fails

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COMMAND: ${{ inputs.command || 'update' }}
      MAX_MINUTES: ${{ inputs.max_minutes || '240' }}
      CHUNK_MINUTES: "40"
      # Minutes budget, per calendar month, by the collector's own count
      # (data/usage.csv). Runs started by hand are counted but not limited.
      HISTORY_BUDGET_MINUTES: "1500"    # full runs that work through the backlog
      MONTH_LIMIT_MINUTES: "1950"       # nothing is planned past this
      DAILY_MAX_MINUTES: "45"           # longest a current-games-only run may go
      RECENT_DAYS: "14"                 # "current games" means the last this-many days
      ALERT_TITLE: "Collector stopped"
      GH_TOKEN: ${{ github.token }}
      COLLECTOR_CONTACT: ${{ vars.COLLECTOR_CONTACT }}
      COLLECTOR_NO_CACHE: "1"
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Decide what this run may do before anything is installed.
      #   backfill  the month's history budget has room: a full run
      #   daily     the history budget is spent: current games only
      #   manual    started by hand: as asked
      # While a "Collector stopped" issue is open, scheduled runs do nothing:
      # a stop is not retried until someone has looked and closed the issue.
      - name: Plan this run
        id: plan
        run: |
          month=$(date -u +%Y-%m)
          today=$(date -u +%F)
          used=0
          if [ -f data/usage.csv ]; then
            used=$(awk -F, -v m="$month" 'NR>1 && $1==m {s+=$6} END {print s+0}' data/usage.csv)
          fi
          ran_today=false
          if grep -q "^$month,$today.*,\(schedule\|push\)," data/usage.csv 2>/dev/null; then ran_today=true; fi
          backlog=false
          if grep -q '"outcome": "paused' data/last_run.json 2>/dev/null; then backlog=true; fi
          # Minutes since the last scheduled run finished (a large number if none).
          since=99999
          last=$(awk -F, 'NR>1 && ($3=="schedule" || $3=="push") {t=$2} END {print t}' data/usage.csv 2>/dev/null || true)
          if [ -n "$last" ]; then
            then_s=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
            since=$(( ( $(date +%s) - then_s ) / 60 ))
          fi
          mode=manual; minutes=$MAX_MINUTES; skip=false; extra=""; reason=""
          held=$(gh issue list --state open --limit 100 --json number,title \
                 --jq "[.[] | select(.title==\"$ALERT_TITLE\")][0].number // empty" 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            if [ "$used" -lt "$HISTORY_BUDGET_MINUTES" ]; then
              mode=backfill
              room=$(( HISTORY_BUDGET_MINUTES - used - 3 ))
              if [ "$ran_today" = true ] && [ "$backlog" = false ]; then
                skip=true; reason="Today's run is done and nothing is waiting."
              fi
            else
              mode=daily
              extra="--recent-days $RECENT_DAYS"
              room=$(( MONTH_LIMIT_MINUTES - used - 3 ))
              if [ "$room" -gt "$DAILY_MAX_MINUTES" ]; then room=$DAILY_MAX_MINUTES; fi
              if grep -q "^$month,$today.*,daily," data/usage.csv 2>/dev/null; then
                skip=true; reason="Today's current-games run is done."
              fi
            fi
            if [ "$room" -lt "$minutes" ]; then minutes=$room; fi
            if [ "$minutes" -lt 5 ]; then
              skip=true; reason="This month's minutes budget is used."
            fi
            # A backup slot that arrives just after a run has finished is not needed.
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$since" -lt 60 ]; then
              skip=true; reason="A run finished $since minutes ago, so this backup slot is not needed."
            fi
            if [ -n "$held" ]; then
              skip=true; reason="On hold: issue #$held (\"$ALERT_TITLE\") is open. Close it to resume."
            fi
          fi
          echo "Minutes used this month (collector's count): $used. Mode: $mode. Planned: $minutes minutes. $reason"
          {
            echo "mode=$mode"
            echo "minutes=$minutes"
            echo "skip=$skip"
            echo "extra=$extra"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: steps.plan.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.plan.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # The run is cut into chunks. Progress is validated and pushed after each
      # one, so a failure costs at most one chunk. If the same file was edited
      # on GitHub in the meantime (for example "include" in leagues.csv), that
      # edit wins over the collector's copy.
      - name: Run collector
        if: steps.plan.outputs.skip != 'true'
        env:
          RUN_MODE: ${{ steps.plan.outputs.mode }}
          RUN_MINUTES: ${{ steps.plan.outputs.minutes }}
          RUN_EXTRA: ${{ steps.plan.outputs.extra }}
        run: |
          t0=$(date +%s)
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          save() {
            if [ -f data/leagues.csv ]; then python run.py validate; fi
            if [ -d data ]; then git add -A data; fi
            if [ -d probe ]; then git add -A probe; fi
            if git diff --cached --quiet; then echo "Nothing new to save."; return 0; fi
            git commit -q -m "Collector $COMMAND: $(date -u +'%F %H:%M')"
            git pull -q --rebase --autostash -X ours
            git push -q
            echo "Progress saved."
          }
          # Mark the start, so it is visible in the repository that a run began.
          mkdir -p data
          echo "Run started $(date -u +'%F %H:%M UTC') (${GITHUB_EVENT_NAME:-manual}, $RUN_MODE, up to $RUN_MINUTES minutes): $COMMAND" > data/run_started.txt
          git add data/run_started.txt
          if ! git diff --cached --quiet; then
            git commit -q -m "Collector started: $(date -u +'%F %H:%M')"
            git pull -q --rebase --autostash -X ours
            git push -q
          fi
          end=$(( $(date +%s) + RUN_MINUTES * 60 ))
          status=0
          why=""
          # The readers must still give the right answers on the saved sample pages.
          if ! python run.py selftest; then
            status=1
            why="Self-test failed: the page readers no longer give the expected results on the saved sample pages in tests/. A change to the code is the likely cause. Nothing was fetched."
          fi
          while [ "$status" -eq 0 ]; do
            left=$(( (end - $(date +%s)) / 60 ))
            if [ "$left" -lt 3 ]; then break; fi
            chunk=$(( left < CHUNK_MINUTES ? left : CHUNK_MINUTES ))
            # RUN_EXTRA is left unquoted on purpose: it is empty or two words.
            python run.py "$COMMAND" --max-minutes "$chunk" $RUN_EXTRA || status=$?
            save
            if [ "$status" -ne 0 ]; then break; fi
            # "paused" means the time ran out with work left; anything else means done.
            grep -q '"outcome": "paused' data/last_run.json 2>/dev/null || break
          done
          if [ -f data/leagues.csv ]; then python run.py export --sheets; fi
          # Record the minutes this run used (rounded up, plus one for set-up).
          if [ ! -f data/usage.csv ]; then echo "month,finished,event,command,mode,minutes" > data/usage.csv; fi
          spent=$(( ( $(date +%s) - t0 + 59 ) / 60 + 1 ))
          echo "$(date -u +%Y-%m),$(date -u +%FT%H:%MZ),${GITHUB_EVENT_NAME:-manual},$COMMAND,$RUN_MODE,$spent" >> data/usage.csv
          save
          # A run that stopped raises an issue, which notifies the repository owner
          # and holds further scheduled runs until the issue is closed.
          if [ "$status" -ne 0 ]; then
            if [ -z "$why" ]; then
              why=$(python -c "import json; print(json.load(open('data/last_run.json'))['outcome'])" 2>/dev/null || true)
            fi
            if [ -z "$why" ]; then why="The run failed before it could record why. See the run log."; fi
            body=$(printf '%s\n\n%s\n\n%s\n' "$why" \
              "Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "Scheduled runs are on hold while this issue is open. Close it to let them resume. See the README section 'If it stops'.")
            open=$(gh issue list --state open --limit 100 --json number,title \
                   --jq "[.[] | select(.title==\"$ALERT_TITLE\")][0].number // empty" 2>/dev/null || true)
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body" || true
            else
              gh issue create --title "$ALERT_TITLE" --body "$body" || true
            fi
          fi
          exit "$status"

      - name: Save anything left
        if: always() && steps.plan.outputs.skip != 'true'
        run: |
          if [ -d data ]; then git add -A data; fi
          if [ -d probe ]; then git add -A probe; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Collector $COMMAND: $(date -u +'%F %H:%M')"
          git pull -q --rebase --autostash -X ours
          git push -q
