name: Collector

on:
  schedule:
    - cron: "23 9 * * 2"          # Tuesdays 09:23 UTC
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        default: update
        options: [update, discover, harvest, probe]
      max_minutes:
        description: Stop cleanly after this many minutes
        default: "240"

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COMMAND: ${{ inputs.command || 'update' }}
      MAX_MINUTES: ${{ inputs.max_minutes || '240' }}
      COLLECTOR_CONTACT: ${{ vars.COLLECTOR_CONTACT }}
      COLLECTOR_NO_CACHE: "1"
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run collector
        run: python run.py "$COMMAND" --max-minutes "$MAX_MINUTES"

      - name: Validate and update the Google Sheet
        if: always()
        run: |
          if [ -f data/leagues.csv ]; then
            python run.py validate
            python run.py export --sheets
          fi

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          if [ -d data ]; then git add -A data; fi
          if [ -d probe ]; then git add -A probe; fi
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Collector $COMMAND: $(date -u +%F)"
          git pull --rebase
          git push
